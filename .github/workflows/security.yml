name: Security

# Vulnerability scanning, report-only: it never gates a PR, because findings
# arrive with disclosure time, not with in-PR changes.
#
# Two scanners cover the two halves of the shipped closure. The first, grype,
# scans the image's C closure via the sbomnix SBOM. Statically linked Haskell
# libraries are invisible to it. The second, osv-scanner, matches every exact pin
# in cabal.project.freeze against OSV.dev. That freeze is the committed projection
# of the Nix package set, and OSV.dev is home to the HSEC advisories the GitHub
# Advisory Database lacks.
#
# Both upload SARIF to GitHub code scanning, so a human triages every finding in
# the Security tab and the issue tracker holds only human-filed work. On a PR they
# run only when the dependency plan changes. On the daily schedule they scan main,
# so advisories disclosed after a release still surface. Remediation is always
# flake-side, carried by Renovate's weekly flake.lock refresh. See
# docs/architecture/release-supply-chain.md → "Vulnerability scanning and
# dependency freshness".
on:
  pull_request:
    paths: ["flake.lock", "flake.nix", "cabal.project.freeze", ".github/workflows/security.yml"]
  schedule:
    - cron: "27 6 * * *" # daily, off-peak minute
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: Vulnerability scan (grype)
    runs-on: ubuntu-latest
    # Sized for a cold run after a dependency-overlay change in flake.nix. The
    # sbomnix build of .#ecluse-bin makes the job pay the full source rebuild of
    # the overridden closure that the main-written cache does not yet hold. A warm
    # run finishes in a fraction of this.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # upload the grype SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore-only for the shared Nix store: build-test is its single
          # writer.
          save-nix-store: "false"

      # grype scans the sbomnix SBOM of .#ecluse-bin into grype.sarif, and prints a
      # table in the log.
      - name: Scan image closure (grype)
        run: nix develop .#ci --command task scan

      - name: Upload grype SARIF to code scanning
        # Surface the closure CVEs in the Security tab (code scanning), alongside
        # Semgrep and Scorecard, via the SARIF upload.
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: grype.sarif
          category: grype

  osv-freeze:
    name: Haskell advisories (OSV/HSEC over the freeze)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the osv-scanner SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Restore-only for the shared Nix store: build-test is its single
          # writer.
          save-nix-store: "false"

      # osv-scanner (from the pinned nixpkgs, like grype) reads the freeze
      # natively. Findings are report-only, so only a scanner error fails here.
      - name: Scan cabal.project.freeze (osv-scanner)
        run: nix develop .#ci --command task scan-osv

      - name: Upload osv-scanner SARIF to code scanning
        # Surface the HSEC advisories in the Security tab (code scanning), alongside
        # grype, Semgrep, and Scorecard.
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: osv-freeze.sarif
          category: osv-hsec
