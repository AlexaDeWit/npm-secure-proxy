name: Scorecard

# OpenSSF Scorecard: automated supply-chain posture scoring. For a project whose
# thesis *is* supply-chain resilience, this is dogfooding. Scorecard grades branch
# protection, pinned dependencies, signed and attested releases, SAST, token
# permissions, and dangerous workflow patterns, then publishes a public score and
# README badge. Report-only: it never gates a PR. Findings surface in the Security
# tab (code scanning) and at scorecard.dev.
on:
  # Re-evaluate when a branch-protection rule or a ruleset changes (a Scorecard input).
  branch_protection_rule:
  # Weekly drift check, offset from security.yml's daily scan.
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF to code scanning (Security tab)
      id-token: write # OIDC to publish results to the OpenSSF API (badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Scorecard flags a credential-persisting checkout

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF API so the README badge resolves.
          # Scorecard publishes only non-sensitive, already-public posture signals.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
