name: CI

# Push-to-main and pull_request, so a feature-branch push never double-runs beside its
# PR. The nightly schedule catches live-registry drift that lands outside this repo.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly health check (most valuably the smoke tier)
  workflow_dispatch:

# Never cancel on main: it keeps the complete build history of every commit that lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default. Jobs that need more widen it at the job level.
permissions:
  contents: read

# Every timeout-minutes below catches a hang, and is not a budget: each clears a fully
# cold run. Raise one that starts to cancel real runs, never tighten one to the mean.
jobs:
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the PR's changed-file list
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The allow-list of documentation paths lives in the script, which fails closed:
      # an unlisted path, an unreadable file list, or any non-PR event runs every job.
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-classify-change.sh

  build-test:
    name: Build & tests (core-unit + app-unit + integration)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    # One build, then every Haskell tier against those same artifacts. Two runners would
    # race to populate one first-writer-wins cabal cache, incomplete for the widest plan.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload (no stored token)
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal # deterministic, cacheable store location
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"

      # Cached here, not in the shared action: no other job builds dist-coverage. The key
      # has the shape of dist-newstyle's: the version family bounds a restore, and the
      # commit makes each main run's save a fresh entry.
      - name: Restore dist-coverage
        id: restore-dist-coverage
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-coverage
          key: dist-coverage-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-${{ github.sha }}
          restore-keys: |
            dist-coverage-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-

      # An exact cabal-store hit already covers cabal.project's pinned index-state, so
      # `cabal update` would only re-fetch TUF metadata over its dead-mirror fallback.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # One throttled pull from the runners' shared Docker Hub IP pool cascades the tier to
      # red. The refs mirror the pins in test/support/Ecluse/Test/Container/Image.hs.
      - name: Pre-pull pinned integration images (Docker Hub throttle resilience)
        run: >-
          bash scripts/docker-prepull.sh
          ministackorg/ministack@sha256:5164592def36af01b8ac76364028e27c5ecd8f1494c8a53d5fcd811cc7dfb594
          otel/opentelemetry-collector@sha256:3805724e26351df55a45032a793c9b64a2117ac9a58f13f070674a9723fab373

      # cache-nix-action trims the store with `nix store gc` before saving, and a dev
      # shell holds no GC root, so without this profile the saved entry loses `.#ci`.
      - name: Root the .#ci shell for the Nix-store cache save
        run: nix develop .#ci --profile "$RUNNER_TEMP/ecluse-ci-profile" --command true

      - name: Cabal checks (build, coverage, doctest, cabal-check)
        run: nix develop .#ci --command task cabal-checks

      - name: Upload core unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-core-unit.json
          flags: unit
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Upload app unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-unit.json
          flags: unit
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Upload runtime unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-runtime-unit.json
          flags: unit
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          files: coverage/ecluse-integration.json
          flags: integration
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      # Sole writer of the three cabal-side caches, and only from main. !cancelled()
      # keeps the warm store when a later tier fails: the deps built fine either way.
      # The two build-product keys end in the commit, so each main run writes a new
      # entry, except on a re-run whose entry the restore above already found.
      - name: Save cabal store (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cabal
          key: cabal-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}

      - name: Save dist-newstyle (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.toolchain.outputs.dist-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-${{ github.sha }}

      - name: Save dist-coverage (main)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore-dist-coverage.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-coverage
          key: dist-coverage-${{ runner.os }}-${{ hashFiles('flake.lock', 'cabal.project', 'cabal.project.freeze') }}-v${{ steps.toolchain.outputs.cabal-version }}-${{ github.sha }}

  smoke:
    name: Smoke tests (live registries, non-gating)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Catches protocol drift when the live registries change their wire behaviour. Not a
    # `gate` dependency, so a transient blip shows red on the PR but blocks no merge.
    continue-on-error: true
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          save-nix-store: "false" # build-test is the single writer of the shared store

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: Smoke tests
        run: nix develop .#ci --command task test-smoke

  e2e:
    name: End-to-end tests (whole-system, real npm)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    # The real OCI image, an nginx stub, and Verdaccio, driven by the real npm CLI. It
    # is hermetic unlike smoke, so it gates. Drop it from the gate only as a last resort.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          # `.#dockerImage` links the same Nix-built Haskell closure `checks.docs` does.
          # On the shared "nix" store this job rebuilt all ~188 of them from source.
          nix-cache-prefix: nix-docs
          save-nix-store: "false" # the docs job is the single writer of nix-docs

      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      # One throttled pull in the suite's setup hook cascades every case to pending. The
      # refs copy the pins in test/support/Ecluse/Test/Container/Image.hs verbatim.
      - name: Pre-pull pinned e2e images (Docker Hub throttle resilience)
        run: >-
          bash scripts/docker-prepull.sh
          ministackorg/ministack@sha256:5164592def36af01b8ac76364028e27c5ecd8f1494c8a53d5fcd811cc7dfb594
          otel/opentelemetry-collector@sha256:3805724e26351df55a45032a793c9b64a2117ac9a58f13f070674a9723fab373
          verdaccio/verdaccio@sha256:9d622d256378c6e7ae09f384774ee2f0f8ac67a66c066db55921a0b7218abc4c
          nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa

      - name: End-to-end suite (builds + loads the image, drives the real npm CLI)
        run: nix develop .#ci --command task test-e2e

  static-checks:
    name: Static checks (format, lint, Semgrep, workflows, site)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sub-minute checks batched so the toolchain setup is paid once. `task static-checks`
    # also assembles the site, so a dangling link fails here, not on the Pages deploy.
    permissions:
      contents: read
      security-events: write # upload the Semgrep SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          save-nix-store: "false" # build-test is the single writer of the shared store

      - name: Static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command task static-checks

      # Semgrep still gates on every PR (`task sast` fails on findings). This upload is
      # only the Security-tab view, which tracks main, hence always().
      - name: Upload Semgrep SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  docs:
    name: Haddock builds
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    # Sized for a cold run after a dependency-overlay change in flake.nix, which
    # rebuilds the overridden closure's doc outputs from source.
    timeout-minutes: 100
    # `checks.docs`, not `cabal haddock`: the cabal path wants a documentation variant of
    # the deps that build-test's store lacks, so it rebuilds the whole closure every run.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # Sole writer of the Nix-built Haskell closure the e2e job also restores. The
          # cap covers the whole store this job accumulates, ~10.5 GB observed.
          nix-cache-prefix: nix-docs
          nix-gc-max-store-size: 13G

      # --out-link, not --no-link: the cache save's `nix store gc` drops every unrooted
      # path, and this job is the sole writer of the closure the e2e job restores.
      - name: Flake checks (docs Haddock, freeze-sync, amazonka-lockstep)
        run: >-
          nix build --out-link "$RUNNER_TEMP/flake-check" --print-build-logs
          .#checks.x86_64-linux.docs
          .#checks.x86_64-linux.freeze-sync
          .#checks.x86_64-linux.amazonka-lockstep

  weeder:
    name: Dead-code check (weeder)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reports library code unreachable from `Ecluse.run`, and any finding fails the gate.
    # Its own job because the -fwrite-ide-info build is heavy.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          save-nix-store: "false" # build-test is the single writer of the shared store

      # dist-analysis is deliberately NOT cached. cabal cannot delete a removed module's
      # artifacts, so a restored builddir feeds weeder orphaned .hie for modules that are gone.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: weeder (fails on findings)
        run: |
          set -eo pipefail
          nix develop .#ci --command task weeder 2>&1 | tee weeder.out

      - name: Render weeder findings to the run summary
        if: always()
        run: |
          {
            echo '## weeder: library code not reachable from the app entry';
            echo;
            echo '_Gating: any finding fails this job and the CI gate. A finding is a definition built into the library but not wired into the app entry (Ecluse.run); land its wiring in the same slice, or root it in weeder.toml._';
            echo;
            echo '```';
            grep -E ':[0-9]+:[0-9]+:' weeder.out || echo '(no findings)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  stan:
    name: Haskell static analysis (stan)
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # HIE-based partial-function analysis at the .stan.toml floor, which Semgrep (no
    # Haskell) and hlint (no type info) cannot see. A finding above the floor fails the gate.
    env:
      CABAL_DIR: ${{ github.workspace }}/.cabal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cabal-cache: "true"
          save-nix-store: "false" # build-test is the single writer of the shared store

      # dist-analysis is not cached here either, for the reason on the weeder job.
      - name: Update package index
        if: steps.toolchain.outputs.cabal-cache-hit != 'true'
        run: nix develop .#ci --command task update

      - name: stan (fails on findings)
        run: |
          set -eo pipefail
          nix develop .#ci --command task stan 2>&1 | tee stan.out

      - name: Render stan findings to the run summary
        if: always()
        run: |
          {
            echo '## stan: Haskell static analysis (gating: any finding above the floor fails this job and the CI gate)';
            echo;
            echo 'Partial functions and potential bugs (HIE-based) at the Warning floor. Nothing is ignored without an explicit decision; run "task stan-all" locally for the full set incl Performance/space-leak.';
            echo;
            echo '```';
            sed -E 's/\x1b\[[0-9;]*m//g' stan.out 2>/dev/null || echo '(no output)';
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: CI gate
    # The single Required check. Wire a new one in by adding it to `needs` here AND to
    # scripts/ci-gate-verdict.sh. The smoke job is absent on purpose: it is non-gating.
    needs: [changes, build-test, static-checks, docs, e2e, weeder, stan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script accepts a skip only from the documentation-only filter, and only for
      # the jobs that filter may skip. Every other skip still fails the gate.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every gating job
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          CHANGES: ${{ needs.changes.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
          DOCS: ${{ needs.docs.result }}
          E2E: ${{ needs.e2e.result }}
          WEEDER: ${{ needs.weeder.result }}
          STAN: ${{ needs.stan.result }}
        run: bash scripts/ci-gate-verdict.sh
